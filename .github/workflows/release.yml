name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build (${{ matrix.archive }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: ragents-linux-x86_64-musl
            use_zigbuild: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            archive: ragents-linux-aarch64-musl
            use_zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ragents-darwin-aarch64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Zig & cargo-zigbuild
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build static musl release binaries
        if: matrix.use_zigbuild
        run: |
          cargo zigbuild --release --target "${{ matrix.target }}" \
            -p ragents-cli --bin ragents \
            -p ragents-core --bin ragents-core-worker

      - name: Build native macOS release binaries
        if: ${{ !matrix.use_zigbuild }}
        run: |
          cargo build --release --target "${{ matrix.target }}" \
            -p ragents-cli --bin ragents \
            -p ragents-core --bin ragents-core-worker
          strip "target/${{ matrix.target }}/release/ragents" "target/${{ matrix.target }}/release/ragents-core-worker"

      - name: Package release archive
        run: |
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/ragents" stage/ragents
          cp "target/${{ matrix.target }}/release/ragents-core-worker" stage/ragents-core-worker
          chmod 0755 stage/ragents stage/ragents-core-worker
          if [ "${{ runner.os }}" = "macOS" ]; then
            COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "dist/${{ matrix.archive }}.tar.gz" -C stage .
            (cd dist && shasum -a 256 "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256")
          else
            tar -czf "dist/${{ matrix.archive }}.tar.gz" -C stage .
            (cd dist && sha256sum "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256")
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/*

  build-wasm:
    name: Build WASM extensions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Rust WASM artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: |
            extensions/shell
            extensions/file_editor
            extensions/image_viewer
            extensions/agents_md
            extensions/skills
            extensions/compaction
            extensions/session_history
            extensions/permissions
            extensions/authn

      - name: Build all WASM extensions
        run: ./scripts/build-extensions.sh

      - name: Package WASM extensions archive
        run: |
          mkdir -p dist stage
          for ext in shell file_editor image_viewer agents_md skills compaction session_history permissions authn; do
            cp "extensions/${ext}/target/wasm32-wasip2/release/ragent_${ext}_extension.wasm" stage/
          done
          chmod 0644 stage/*.wasm
          tar -czf dist/ragents-wasm-extensions.tar.gz -C stage .
          (cd dist && sha256sum ragents-wasm-extensions.tar.gz > ragents-wasm-extensions.tar.gz.sha256)

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragents-wasm-extensions
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build-binaries, build-wasm]
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum *.tar.gz | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
